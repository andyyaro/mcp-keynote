name: CI

on:
  push:
    branches: [master, modernize]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy (strict) on src/
        run: uv run mypy

  unit-tests:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests with coverage
        # Integration tests (-m keynote) are deliberately NOT run here:
        # GitHub macOS runners ship without Keynote and cannot grant the
        # Automation/Accessibility (TCC) consent AppleScript needs. Run them
        # locally with `make test-integration` on a Mac with Keynote.
        run: uv run pytest tests/ --cov=keynote_mcp --cov-report=term --cov-fail-under=85
