    Real artifacts only (FACTS.md): the spec is scripts/verify_tools.py's own build_deck spec, trimmed; the validation
    reply and the osascript lines are real outputs captured from the code with osascript mocked; the slides on the
    canvas are REDRAWN from the repo's specs (the repo has no slide screenshots and Keynote is not driven here).

              mask-image: linear-gradient(to bottom, transparent 0, transparent var(--t0), #000 var(--t1), #000 916px, transparent 936px); }

    #b-wires { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }

    /* the validation reply */
    #b-val { left: 500px; top: 298px; width: 790px; } /* 12 px under the Spec check card, never over its edge */
    #b-val .vh { padding: 14px 24px 0; font-size: 22px; line-height: 28px; font-weight: 600; }

    /* the osascript window */

             font-size: 22px; line-height: 28px; font-weight: 600; color: var(--label-primary); white-space: pre; }

    #b-exp .chip { font-size: 22px; line-height: 26px; padding: 2px 11px; }
    /* proof row */
    .num { font-size: 36px; line-height: 38px; font-weight: 700; color: var(--brand-navy); letter-spacing: -0.5px; }
    #b-up { flex-direction: column; align-items: flex-start; justify-content: center; gap: 12px; padding: 14px 18px; }
    #b-up .uh { display: flex; align-items: center; gap: 10px; font-size: 23px; line-height: 27px; font-weight: 600; }
    #b-up .uh .ic { font-size: 24px; color: var(--label-secondary); }

    #b-up .chip.me { background: rgba(47, 100, 176, 0.12); color: var(--brand-blue); font-weight: 600; }
    /* the overview header (world coordinates) */
    #b-head { position: absolute; left: 40px; top: 36px; width: 1840px; display: flex; align-items: center; justify-content: space-between; }
    #b-title { font-size: 30px; line-height: 36px; font-weight: 700; }
    #b-legend { display: flex; gap: 28px; }
    .lg { display: flex; align-items: center; gap: 9px; font-size: 22px; line-height: 28px; white-space: nowrap; }
    /* the redrawn native table (verify_tools.py:1806-1809) */
    .tb { position: absolute; left: 39px; top: 40px; width: 420px; font-size: 21px; line-height: 26px; color: #000; }
    .tr { display: grid; grid-template-columns: 116px 152px 152px; height: 50px; align-items: center; border-bottom: 1px solid var(--system-gray-3); }
    .tr > span { padding: 0 16px; text-align: right; white-space: nowrap; }
    .tr > span:first-child { padding-left: 20px; text-align: left; }
    .tr.th { background: #2f4b7c; color: #fff; font-weight: 600; border-bottom: 0; }
    .tr.alt { background: #f2f4f8; }
    .tr.tt { font-weight: 600; }
    .tr .f { position: relative; height: 50px; }
    #cv-hl { position: absolute; left: 4px; right: 4px; top: 6px; bottom: 6px; border-radius: 6px; background: rgba(47, 100, 176, 0.14); }
    #cv-f, #cv-35 { position: absolute; right: 16px; top: 12px; font-weight: 600; }
    #cv-f, .tr .fx { color: var(--brand-blue); }
    #cv-35 { font-weight: 700; }
  </style>
  <div id="root" data-composition-id="s3-board" data-width="1920" data-height="1080">
    <div id="b-all">
      <div id="b-fade">
        <div id="b-cam" data-layout-allow-overflow>
          <div id="b-head">
            <div id="b-title">mcp-keynote architecture</div>
            <div id="b-legend">
              <div class="lg"><i class="dot live"></i>verified against Keynote 14.5</div>
              <div class="lg"><i class="dot ci"></i>tested in CI, no Keynote</div>
            </div>
          </div>

          <div id="z-srv" class="zone" style="left:474px; top:110px; width:810px; height:640px"></div>
          <div id="z-srv-l" class="zl" style="left:496px; top:124px"><b>keynote-mcp server</b><span>Python · MCP stdio</span></div>
          <div id="z-mac" class="zone" style="left:1310px; top:110px; width:570px; height:640px"></div>
          <div id="z-mac-l" class="zl" style="left:1332px; top:124px"><b>On the Mac</b><span>Keynote 14.5 · macOS 26.5.1</span></div>

          <!-- the token travels the argv wire UNDER the cards: it shows only in the gap -->
          <div id="b-tok" class="tok"><svg class="ic"><use href="#ic-text-alignleft" /></svg></div>
          <svg id="b-wires" viewBox="0 0 1920 1080"></svg>

          <div id="b-wls"></div>

          <!-- the deck spec window: scripts/verify_tools.py's build_deck spec (lines 2240-2278), trimmed with … -->
          <div id="b-spec" class="win" style="left:40px; top:306px; width:380px; height:560px">
            <div class="win-h">
              <div class="tile" style="background:var(--brand-blue)"><svg class="ic"><use href="#ic-doc" /></svg></div>

            <div class="sh"><div class="t">Slides and exports</div><span id="b-17" class="chip">17 chart types</span></div>

          <!-- the upstream card (lit in the overview) -->
          <div id="b-up" class="card" style="left:1174px; top:772px; width:706px; height:124px">
            <div class="uh"><svg class="ic"><use href="#ic-arrow-uturn-forward" /></svg>Upstream</div>
            <div class="uc">
              <span class="chip" id="up-1">easychen/keynote-mcp</span><svg class="ic"><use href="#ic-chevron-right" /></svg>
              <span class="chip" id="up-2">ByAxe/keynote-mcp</span><svg class="ic"><use href="#ic-chevron-right" /></svg>

      <!-- screen space, above the camera -->
      <div id="sec-b1" class="sec" data-layout-allow-overlap><b>One spec, one call</b><span>the client sends the whole deck to build_deck</span></div>
      <div id="sec-b2" class="sec" data-layout-allow-overlap><b>Checked first</b><span>nothing is created when the spec is wrong</span></div>
      <div id="sec-b3" class="sec" data-layout-allow-overlap><b>Text as data</b><span>osascript gets your text as argv, never as code</span></div>
      <div id="sec-b4" class="sec" data-layout-allow-overlap><b>Native Keynote objects</b><span>tables, charts and connectors, then exports</span></div>
      <div id="sec-b5" class="sec" data-layout-allow-overlap><b>Round trip</b><span>describe_deck reads a deck back into its spec</span></div>

  <script>
    (function () {
      const TM = window.TM, VO = window.VO;
      const S0 = TM.s3[0], S1 = TM.s3[1];
      const F = (t) => t - S0; // film seconds -> scene-local seconds
      const B = (k, i = 0) => F(TM[k][i]);
      const W = window.BOARD.W(S0);
      const cam = document.getElementById("b-cam");

      const { CARDS, WIRES } = window.BOARD.build();

      // ---- camera: frame world point (cx, cy) at zoom s in the area between the title band and the captions
      const C = (cx, cy, s) => ({ x: 960 - cx * s, y: 523 - cy * s, scale: s });
      const tl = gsap.timeline({ paused: true });
      const go = (at, cx, cy, s, d = 1.3) => tl.to(cam, { ...C(cx, cy, s), duration: d, ease: "power2.inOut" }, at);
      const { pop, fade, out, dot, ph, light, quiet, wire, hl, unhl, count } = window.BOARD.helpers(tl, WIRES);
      // a window opens: opaque quickly (never a see-through overlay on text), then settles
      const win = (sel, at) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, at);
        tl.fromTo(sel, { y: 14, scale: 0.97 }, { y: 0, scale: 1, duration: 0.55, ease: "back.out(1.4)" }, at);
      };
      // section titles: one per beat, crossfading at the beat start
      const SECS = ["b1", "b2", "b3", "b4", "b5", "b6"];
      gsap.set(SECS.map((b) => `#sec-${b}`), { opacity: 0 });
      SECS.forEach((b, i) => {
        const a = i === 0 ? 0.25 : B(b) - 0.05;
        tl.fromTo(`#sec-${b}`, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, a);
        tl.to(`#sec-${b}`, { opacity: 0, duration: 0.3, ease: "power1.in" }, B(b, 1) - 0.4);
      });

      // initial state: nothing on the board yet
      const ALLCARDS = CARDS.map((c) => `#c-${c.id}`).concat(["#b-spec", "#b-slides", "#b-up"]);
      gsap.set(ALLCARDS.concat([".zone", ".zl", ".wl", "#b-head", "#b-val", "#b-osa", "#b-tok", "#b-j2", ".cv", "#b-git", "#b-17", ".st"]), { opacity: 0 });
      gsap.set(["#cv-35"], { opacity: 0 });
      gsap.set("#b-j2", { display: "none" });
      gsap.set("#b-exp .chip", { opacity: 0.4 }); // the export formats wait, unlit, until the voice names them
      tl.set({}, {}, F(S1) - 0.001); // the timeline spans the whole slot

      // ===================== b1: one spec (v03), checked by the server (v04) =====================
      tl.fromTo(cam, C(222, 418, 1.34), { ...C(222, 422, 1.37), duration: F(VO.v03.end) - 0.35, ease: "none" }, 0);
      tl.fromTo("#b-fade", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
      pop("#c-client", W("v03", "claude") - 0.1);
      tl.fromTo("#c-client-chips .chip", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.12 }, W("v03", "claude") + 0.35);
      pop("#b-spec", W("v03", "writes") + 0.05);
      hl("#j1-slides", W("v03", "slides"));
      hl("#j1-table", W("v03", "tables"));
      hl("#j1-chart", W("v03", "charts"));
      hl("#j1-notes", W("v03", "notes"));
      hl("#j1-transition", W("v03", "transitions"));
      // v04: the server zone arrives, server.py and the spec check light on their words
      const v4 = F(VO.v04.start);
      go(F(VO.v03.end) - 0.35, 590, 360, 1.36, 1.2);
      fade("#z-srv", v4 - 0.5, 0.6);
      fade("#z-srv-l", v4 - 0.3, 0.4);
      ["server", "check", "styles", "build", "png", "frag", "desc", "runner"].forEach((id, i) => ph(`#c-${id}`, v4 - 0.3 + i * 0.05));
      wire("w-call", W("v04", "server") - 0.35, 0.4);
      fade("#wl-call", W("v04", "server") - 0.1, 0.35);
      light("#c-server", W("v04", "server"));
      dot("#c-server-st", W("v04", "server") + 0.5);
      wire("w-spec", W("v04", "checks") - 0.2, 0.25);
      light("#c-check", W("v04", "checks"));
      ["#j1-slides", "#j1-table", "#j1-chart", "#j1-notes", "#j1-transition"].forEach((s) => unhl(s, W("v04", "before")));

      // ===================== b2: checked first (v05): the real reply =====================
      const b2 = B("b2");
      go(F(VO.v04.end) - 0.1, 895, 483, 1.26, 1.1); // the spec check stays whole above its reply, the reply whole above the captions
      // the reply opens over rows 2-4: what lies under it steps back (lit parts to 30%, faint placeholders to 15%)
      const DIM2 = "#c-server, #b-spec, #c-client, #wl-call, #w-call, #w-spec";
      const PH2 = "#c-styles, #c-build, #c-png, #c-frag, #c-desc, #c-runner";
      tl.to(DIM2, { opacity: 0.1, duration: 0.6, ease: "power1.inOut" }, b2); // faint enough that the cut JSON at the frame edge never competes with the reply
      tl.to(PH2, { opacity: 0.12, duration: 0.6, ease: "power1.inOut" }, b2);
      win("#b-val", W("v05", "a") - 0.25);
      tl.fromTo("#vr1 .vi", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" }, W("v05", "typo"));
      hl("#vr1 .bad", W("v05", "typo"), "rgba(255,56,60,0.10)");
      tl.fromTo("#vr3 .vi", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" }, W("v05", "invented"));
      hl("#vr3 .bad", W("v05", "invented"), "rgba(255,56,60,0.10)");
      hl("#fx1", W("v05", "named"));
      hl("#fx3", W("v05", "use"));
      dot("#b-val-st", W("v05", "invented") + 0.6); // "0 AppleScript calls" holds ~2.7 s, after both rejected keys

      // ===================== b3: text as data (v06, v07) =====================
      const b3 = B("b3");
      const t3 = F(VO.v05.end) + 0.05;
      out("#b-val", t3 - 0.1, 0.35);
      tl.to(DIM2, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, t3);
      tl.to(PH2, { opacity: 0.5, duration: 0.5, ease: "power1.inOut" }, t3);
      go(t3, 662, 452, 1.4, 1.2);
      wire("w-valid", W("v06", "your") - 0.3, 0.25);
      fade("#wl-valid", W("v06", "your") - 0.2, 0.3);
      light("#c-build", W("v06", "your") - 0.05);
      wire("w-style", W("v06", "your") + 0.2, 0.25);
      quiet("#c-styles", W("v06", "your") + 0.35); // side branches fill in quietly: only the text's own path (build_deck, fragments.py, runner) pulses
      wire("w-frag", W("v06", "reaches") - 0.1, 0.25);
      light("#c-frag", W("v06", "applescript") - 0.1);
      wire("w-png", W("v06", "applescript") + 0.25, 0.25);
      quiet("#c-png", W("v06", "applescript") + 0.4);
      wire("w-osa", W("v06", "arguments") - 0.3, 0.25);
      fade("#wl-osa", W("v06", "arguments") - 0.2, 0.3);
      light("#c-runner", W("v06", "arguments"));
      const DIM3 = "#c-png, #c-desc, #b-spec, #c-styles, #w-png, #w-style";
      tl.to(DIM3, { opacity: 0.18, duration: 0.4, ease: "power1.inOut" }, W("v06", "arguments") + 0.2);
      win("#b-osa", W("v06", "arguments") + 0.45);
      hl("#b-ref", W("v06", "never"));
      dot("#b-osa-st", W("v06", "pasted") + 0.1);
      // v07: the title travels as argv into Keynote, which shows it as plain title text
      const v7 = F(VO.v07.start);
      const t7 = F(VO.v06.end) - 0.15;
      out("#b-osa", t7 - 0.05, 0.35);
      tl.to(DIM3, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, t7);
      tl.to("#c-desc", { opacity: 0.5, duration: 0.5, ease: "power1.inOut" }, t7);
      go(t7, 1374, 424, 1.35, 1.1);
      fade("#z-mac", v7 - 0.55, 0.6);
      fade("#z-mac-l", v7 - 0.35, 0.4);
      ph("#b-slides", v7 - 0.3);
      ph("#c-keynote", v7 - 0.25);
      tl.set("#b-slides > *", { opacity: 0 }, 0);
      wire("w-argv", W("v07", "so") - 0.05, 0.35);
      fade("#wl-argv", W("v07", "so") + 0.1, 0.3);
      tl.fromTo("#b-tok", { x: 1240, y: 629, opacity: 0 }, { x: 1262, y: 629, opacity: 1, duration: 0.3, ease: "power1.out" }, W("v07", "title"));
      tl.to("#b-tok", { x: 1324, duration: 0.5, ease: "power1.inOut" }, W("v07", "title") + 0.3);
      tl.to("#b-tok", { opacity: 0, duration: 0.15 }, W("v07", "title") + 0.75);
      light("#c-keynote", W("v07", "quotes"));
      light("#b-slides", W("v07", "quotes") + 0.2);
      tl.set("#b-17", { opacity: 0 }, W("v07", "quotes") + 0.21);
      fade("#cv-adv", W("v07", "break") - 0.05, 0.4);
      const swap = (prev, at) => tl.set(prev, { opacity: 0 }, at + 0.45); // the slide underneath is hidden once covered
      dot("#c-runner-st", W("v07", "take"));

      // ===================== b4: native Keynote objects (v08), then exports (v09) =====================
      const b4 = B("b4");
      // zoomed framings keep each zone label either fully under the title (y < 104) or fully below it (y > 116)
      go(F(VO.v07.end) + 0.05, 1595, 420, 1.36, 1.2);
      tl.to(cam, { ...C(1595, 414, 1.4), duration: W("v09", "html") + 0.5 - (F(VO.v07.end) + 1.25), ease: "none" }, F(VO.v07.end) + 1.25);
      dot("#c-keynote-st", W("v08", "keynote"));
