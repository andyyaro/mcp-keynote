[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "keynote-mcp"
version = "2.0.0"
description = "An MCP server for controlling Apple Keynote presentations via AppleScript"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "easychen", email = "easychen@gmail.com" },
    { name = "ByAxe" },
]
maintainers = [
    { name = "Andy Yaro" },
]
keywords = [
    "keynote",
    "mcp",
    "model-context-protocol",
    "applescript",
    "automation",
    "presentation",
    "macos",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Office/Business :: Office Suites",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
    "aiohttp>=3.9",
    "aiofiles>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-aiofiles",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/andyyaro/mcp-keynote"
Repository = "https://github.com/andyyaro/mcp-keynote"
Upstream = "https://github.com/ByAxe/keynote-mcp"
Original = "https://github.com/easychen/keynote-mcp"

[project.scripts]
keynote-mcp = "keynote_mcp.server:main"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "E501", # long lines in embedded AppleScript are clearer unwrapped
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"] # asserts and subprocess calls are the point of tests

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["aiohttp.*", "aiofiles.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not keynote' --strict-markers --strict-config"
markers = [
    "keynote: integration tests that drive a real Keynote.app (deselected by default; run with -m keynote)",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["keynote_mcp"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
